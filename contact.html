<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffe6eb;
            color: #333;
        }

        /* HEADER */
        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #b74e6a;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav a {
            text-decoration: none;
            color: #b74e6a;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 20px;
            transition: 0.3s;
        }

        nav a:hover {
            background: #ffb6c1;
            color: white;
        }

        /* CONTACT */
        .contact {
            width: 100%;
            min-height: calc(100vh - 70px);
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contact h1 {
            font-size: 55px;
            color: #b74e6a;
            margin-bottom: 10px;
            text-transform: lowercase;
        }

        .contact>p {
            color: #777;
            font-size: 18px;
            margin-bottom: 45px;
        }

        .contact-form {
            width: 620px;
            max-width: 100%;
        }

        .input-box {
            width: 100%;
            background: white;
            border: 1px solid #f3b7c5;
            border-radius: 5px;
            padding: 20px 25px;
            margin-bottom: 20px;
            font-size: 16px;
            outline: none;
        }

        .input-box:focus {
            border-color: #ff7f9f;
            box-shadow: 0 0 5px rgba(255, 127, 159, 0.3);
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row .input-box {
            width: 50%;
        }

        textarea.input-box {
            height: 200px;
            resize: vertical;
        }

        .btn {
            display: block;
            margin-left: auto;
            padding: 13px 35px;
            border: none;
            border-radius: 25px;
            background: #ff6f91;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #b74e6a;
            transform: translateY(-2px);
        }

        /* MOBILE */
        @media (max-width: 650px) {

            header {
                padding: 0 20px;
            }

            .logo {
                font-size: 20px;
            }

            nav {
                gap: 5px;
            }

            nav a {
                padding: 8px 10px;
                font-size: 14px;
            }

            .contact h1 {
                font-size: 40px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }

            .row .input-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            SHOP ĐIỆN THOẠI
        </div>

        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="./thanhVien/thanhVien.html">Giới thiệu thành viên</a>
        </nav>

    </header>


    <!-- CONTACT -->
    <section class="contact">

        <h1>contact us</h1>

        <p>
            Chúng tôi rất vui khi nhận được phản hồi từ bạn!
        </p>

        <form class="contact-form" onsubmit="sendMessage(event)">

            <input type="text" class="input-box" id="name" placeholder="Họ và tên" required>

            <div class="row">

                <input type="email" class="input-box" id="email" placeholder="Email" required>

                <input type="tel" class="input-box" id="phone" placeholder="Số điện thoại" required>

            </div>

            <textarea class="input-box" id="message" placeholder="Nội dung góp ý..." required></textarea>

            <button type="submit" class="btn">
                Gửi tin nhắn
            </button>

        </form>

    </section>


    <!-- JAVASCRIPT -->
    <script>
        function sendMessage(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phone").value;
            let message = document.getElementById("message").value;

            if (
                name === "" ||
                email === "" ||
                phone === "" ||
                message === ""
            ) {
                alert("Vui lòng nhập đầy đủ thông tin!");
                return;
            }

            alert("Cảm ơn " + name + "! Góp ý của bạn đã được gửi.");

            document.querySelector(".contact-form").reset();
        }
    </script>

</body>

</html>
